<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Restored editor pilot</title>
<link rel="stylesheet" href="/editor.css">
<style>
body { margin: 24px; background: #131b27; color: #e1e7ef; font: 14px system-ui; }
main { max-width: 1320px; margin: auto; }
.pilot-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.pilot-controls button { padding: 6px 10px; font: inherit; }
.pilot-status { display: block; min-height: 24px; }
.pilot-editors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pilot-editors section { min-width: 0; }
.pilot-editor { height: 170px; }
h1 { font-size: 20px; } h2 { font-size: 15px; }
</style></head><body><main id="pilot"></main><script type="module" src="/pilot.js"></script></body></html>

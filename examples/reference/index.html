<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>quote.ts · StTropez</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <h1>quote.ts</h1>
            <output id="saved"></output>
            <button id="save" type="button">Save</button>
            <button id="save-reviewed" type="button" hidden>Save reviewed working copy</button>
            <button id="adopt" type="button" hidden>Use saved copy</button>
        </header>
        <nav aria-label="Document view">
            <button id="source" aria-pressed="true">Source</button>
            <button id="changes" aria-pressed="false">Changes</button>
            <button id="find" type="button">Find</button>
        </nav>
        <div id="search"></div>
        <div id="pane"></div>
        <details>
            <summary>Storage simulation</summary>
            <div class="bar">
                <label><input id="compare-versions" type="checkbox" checked> Compare versions on write</label>
                <label><input id="delay" type="checkbox"> Delay writes</label>
                <label><input id="canonical" type="checkbox"> Trim trailing whitespace on save</label>
                <label>Next write
                    <select id="fault">
                        <option value="none">Normal</option>
                        <option value="fail">Fail before commit</option>
                        <option value="lose-reply">Lose reply after commit</option>
                    </select>
                </label>
            </div>
        </details>
        <section aria-label="Language tools">
            <div class="bar">
                <button id="connect">Connect language server</button>
                <output id="connection"></output>
            </div>
            <div id="tools" hidden>
                <fieldset id="working-tools">
                    <legend>Working copy commands</legend>
                    <div class="bar">
                        <button id="complete">Complete</button>
                        <button id="hover">Hover</button>
                        <button id="signature">Signature</button>
                        <button id="definition">Definition</button>
                        <button id="references">References</button>
                        <button id="rename">Rename</button>
                        <button id="actions">Code actions</button>
                        <button id="links">Document links</button>
                        <button id="command">Run server command</button>
                    </div>
                    <output id="result"></output>
                    <div id="choices"></div>
                </fieldset>
                <div id="diagnostics" aria-label="Diagnostics"></div>
            </div>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
